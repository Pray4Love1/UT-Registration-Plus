jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}  # Ensures correct branch for PRs
          persist-credentials: true  # Allows git ops if needed

      - name: Mark repo as git safe (wildcard to cover container mounts)
        run: git config --global --add safe.directory '*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          autoAcceptChanges: main
          # Explicitly set these to bypass any auto-detection flakiness
          branchName: ${{ github.head_ref || github.ref_name }}
          commitSha: ${{ github.sha }}
