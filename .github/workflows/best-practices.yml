name: Best Practices

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint

  format-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for the action to push commits

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}  # Important for PRs (checks out the PR branch)
          persist-credentials: true  # Ensures GITHUB_TOKEN can be used to push

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run Prettier (auto-fix)
        run: pnpm prettier --write src  # Adjust glob if your script uses a different pattern, e.g., '.'

      - name: Commit formatting changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5  # v5 is stable and widely used; upgrade to @v7 if you want latest features
        with:
          commit_message: Apply Prettier formatting
          branch: ${{ github.head_ref || github.ref_name }}
          skip_dirty_check: false  # Only commit if files actually changed
          # Optional: Limit to specific files if you want to be more targeted
          # file_pattern: src/**/*.{ts,tsx,js,jsx,json,css,md}
